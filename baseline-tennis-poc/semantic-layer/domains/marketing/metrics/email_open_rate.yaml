id: email_open_rate
label: Email Open Rate (human)
one_line: Unique human opens divided by delivered, excluding machine opens and transactional mail.

definition:
  description: >
    Share of delivered marketing messages that a human opened. Machine opens from
    privacy proxies are excluded, and transactional mail is excluded entirely.
  formula: "SUM(opened = 1 AND machine_opened = 0) / SUM(delivered)"
  source_table: email_sends
  filters:
    - "delivered = 1"
    - "email_type != 'transactional'"
    - "machine_opened = 0 (in the numerator only)"
  filter_rationale: >
    Since Apple Mail Privacy Protection began prefetching images, roughly a third
    of recorded opens never involved a human. Transactional mail (order
    confirmations, shipping notices) is operational, has structurally different
    engagement, and is not marketing performance.
  denominator_note: >
    The denominator is DELIVERED, not sent. Undelivered mail could not have been
    opened, so including it would understate the rate and confuse a
    deliverability problem with an engagement problem.
  additive: false
  additive_note: >
    NEVER average this across periods or segments. A rate has a denominator; the
    average of two rates is not the rate of the combined population. Always re
    derive from summed numerator and summed denominator.
  grain:
    minimum: week
    default: month
    minimum_rationale: >
      Daily open rate is dominated by send timing rather than engagement. Weekly
      is the smallest grain that means anything.
  dimensions: [month, week, segment, campaign, email_type]
  available_filters:
    segment: "Restricts to one customer segment (competitive, recreational)."
    campaign_id: "Restricts to orders or sends attributed to one campaign id."
    email_type: "Restricts to one email stream (lifecycle, campaign)."

evaluation:
  direction: higher_better
  benchmark_source: benchmarks.yaml
  seasonal_pattern:
    - "Spring campaign months (March through May) run a few points hotter as league season lifts engagement."
    - "December runs cooler alongside reduced send volume."
  seasonal_guidance: >
    A month inside the normal band is not news in either direction.

framing:
  required_caveats:
    - >
      Open rate is a DIRECTIONAL signal only since Apple Mail Privacy Protection.
      Machine opens are excluded here, but proxy behavior still adds noise that
      moves independently of human engagement. Do not make a decision on open
      rate alone.
    - >
      This band is not comparable to a raw open rate from any other tool. Raw
      open rate includes machine opens and runs materially higher.
  companions:
    - email_click_rate
  companion_rationale: >
    Click rate is the decision metric for campaign performance. It requires a
    deliberate human action, so privacy proxies do not inflate it. Always offer
    click rate alongside open rate.
  when_not_to_use:
    - "Do not use to judge deliverability; a rise in opens is not evidence of better inbox placement."
    - "Do not use to compare against an industry benchmark that includes machine opens."
    - "Do not use as the sole basis for a subject line or creative decision; use click rate."

reliability:
  min_sample: 100
  coverage: []
  definition_caveats:
    - "machine opens are excluded from the numerator, so this rate is not comparable to raw open rate from any external tool"
    - "open detection depends on image loading; a human who reads with images off is not counted as an open"
  cannot_answer:
    - "raw open rate including machine opens (deliberately not exposed; it is a misleading number)"
    - "whether a specific individual read a message (open detection is probabilistic)"
    - "transactional email engagement (excluded from this metric by definition)"

access:
  path: metrics_engine
  raw_sql_allowed: false
