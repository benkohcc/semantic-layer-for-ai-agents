# Access path descriptors: the non metric ways to reach data.
#
# A path is a catalog asset like any other. Declaring them here is what lets
# discover_assets surface "you can build an audience for that" instead of
# returning nothing and letting the agent conclude the question is unanswerable.

asset_type: access_path

edges: []

access_paths:
  - id: build_audience
    label: Audience Builder
    tool: build_audience
    summary: >
      Selects a customer population by behaviour and returns a cohort handle plus a
      count. The "who should I send this to" path.
    answers:
      - "who should I send this promotion to"
      - "who is due for a restring"
      - "which customers are at risk of churning"
      - "who has never bought shoes but buys everything else"
      - "which lapsed customers are worth a win-back"
    criteria: >
      bought_category, not_bought_category, bought_racket_type, segment, region,
      price_tier, lapsed_category_months, active_only, inferred_churned_only,
      min_orders.
    composition_rule: >
      Selects only. Pass the returned handle to get_metric as `cohort` to measure
      the audience's value. A count with no measurement does not tell a marketer
      whether to spend money.
    when_not_to_use:
      - "For a metric value or a slice of one. Use get_metric."
      - >
        For a propensity or likelihood score. An audience describes who DID
        something; this layer does not predict who WILL.
    known_limitations:
      - >
        NO PII EXISTS in this warehouse. Returns customer ids and counts, never
        names, email addresses or phone numbers, and there is no export path. The
        audience DEFINITION goes to the email platform; the contact list is
        assembled there.
      - >
        Selection rests on RECORDED purchases. A customer who bought elsewhere
        looks like a non buyer.
      - >
        lapsed_category_months and inferred_churned_only rest on purchase silence,
        not an observed event. Disclose that whenever they are used.

  - id: category_affinity
    label: Cross-sell Affinity
    tool: category_affinity
    summary: >
      Co-purchase rates between categories, with LIFT over the population base
      rate. The cross-sell and bundling path.
    answers:
      - "what do racket buyers also buy"
      - "what should we cross-sell to someone who bought a racket"
      - "which categories pair best with shoes"
    when_not_to_use:
      - "For category revenue or order counts. Use get_metric with the category dimension."
    known_limitations:
      - >
        READ LIFT, NOT SHARE. A popular category shows a high share against
        everything. Lift near 1.0 means there is no real pairing.
      - >
        CUSTOMER level co-purchase, not basket level. Supports a cross-sell
        campaign, not a physical bundle.
      - "Correlational. A pairing is not evidence that promoting one sells the other."

  - id: search_campaigns
    label: Campaign Registry
    tool: search_campaigns
    summary: >
      Searches campaign BRIEFS: objective, target audience, offer, owner, status
      and post campaign learnings. Returns the campaign_id needed to pull governed
      performance.
    answers:
      - "which campaign performed best and why"
      - "what campaigns did we run for competitive players"
      - "find me a campaign comparable to the one that worked"
      - "what did we learn from the restring campaign"
    composition_rule: >
      A campaign question has two halves. This returns the BRIEF; get_metric with a
      campaign_id filter returns the NUMBERS. Report both: revenue with no
      objective cannot be judged a success or failure.
    when_not_to_use:
      - "For campaign revenue or engagement. Each result carries the get_metric call."
    known_limitations:
      - "Attribution is LAST TOUCH throughout."
      - "budget is planned spend, not spend delivered."
      - >
        learnings is a human retrospective written after the campaign closed. It is
        useful context and opinion, NOT a governed metric.
      - >
        A null learnings field means the campaign is still running. That is an
        honest absence, not missing data.

  - id: relationship_selection
    label: Relationship Traversal
    tool: build_audience
    milestone: 2
    summary: >
      Closed set of traversal operations over the referral and purchase graph:
      referral_chain, chain_stats, exposed_cohort, trace_cohort.
    answers:
      - "which channel produced the best referral chains"
      - "are customers referred by someone who churned more likely to churn"
      - "trace everyone who bought the recalled string through a campaign"
    composition_rule: >
      Selects cohorts only, returned as handles. Measured quantities come from
      get_metric with the cohort parameter.
    when_not_to_use:
      - >
        Aggregations over attributes, including counting referred customers and
        revenue from referred customers. Those are metric questions.
