# Eval questions with gold criteria.
#
# Scoring checks the TOOL TRACE as well as the answer text. A correct number
# reached the wrong way (raw SQL, or a metric recomputed outside the metrics
# engine) is a FAIL, because the trace is what proves the mechanism.
#
# Criteria are checkable facts, not exact wording:
#   must_contain      : all of these must appear (string or regex, case insensitive)
#   must_contain_any  : at least one from each group must appear
#   must_not_contain  : none of these may appear (a hard failure)
#   tools_required    : these tools must appear in the trace
#   tools_forbidden   : these tools must NOT appear
#   metric_required   : get_metric must have been called with these metric_ids
#   numbers_expected  : values that must appear, with tolerance

questions:
  # =====================================================================
  # Milestone 1: metric, diagnosis, policy, interpretation
  # =====================================================================

  - id: 1
    question: "How did email open rates do last month?"
    archetype: metric-lookup
    expected_assets: [email_open_rate, email_click_rate]
    gold:
      value: 0.2365
      band: [0.2307, 0.2551]
      verdict: within_band
    criteria:
      tools_required: [get_metric]
      tools_forbidden: [run_sql]
      metric_required: [email_open_rate]
      numbers_expected:
        - value: 23.5
          tolerance: 1.5
          note: "open rate as a percentage"
      must_contain_any:
        - ["machine open", "machine-open", "mpp", "privacy protection", "privacy proxy"]
        - ["within", "normal", "in line", "in the band", "typical"]
        - ["click"]
        # The governed definition must be visible, but either exclusion
        # establishes that: naming machine opens OR transactional mail shows the
        # answer is not a raw open count. Requiring both words was testing
        # phrasing rather than correctness.
        - ["transactional", "machine open", "human open", "not comparable",
           "raw open"]
      must_not_contain:
        - "31%"     # the naive raw-open-rate figure
      notes: >
        Must exclude machine opens and transactional mail, state the band
        judgment, carry the MPP caveat, and offer click rate as the companion.

  - id: 2
    question: "What was revenue last month?"
    archetype: metric-lookup
    expected_assets: [net_revenue]
    gold:
      value: {{gold.net_revenue_last_month}}
    criteria:
      tools_required: [get_metric]
      tools_forbidden: [run_sql]
      metric_required: [net_revenue]
      numbers_expected:
        - value: {{gold.net_revenue_last_month}}
          tolerance: 2000
      must_contain_any:
        - ["net", "net of refund"]
        - ["test", "wholesale"]
      must_not_contain:
        - "580340"   # a naive gross-ish figure a raw SQL agent lands on
      notes: >
        Must be NET, must note the test and wholesale exclusions, must not report
        the naive gross figure.

  - id: 3
    question: "Why did new customer signups drop last month?"
    archetype: metric-decline-diagnosis
    expected_assets: [new_customer_signups, q3-media-plan]
    gold:
      concentrated_in: paid_search
      prior_month: 117
      last_month: 74
      cause: documented paid search budget pause
    criteria:
      tools_required: [get_metric, search_knowledge]
      tools_forbidden: [run_sql]
      metric_required: [new_customer_signups]
      must_contain_any:
        - ["paid search", "paid_search"]
        - ["pause", "paused"]
        - ["budget"]
        - ["media plan", "q3 media"]
      must_contain:
        - "channel"
      notes: >
        Must decompose by channel, isolate paid_search, and cite the documented
        budget pause from the Q3 media plan. Should note other channels held flat.

  - id: 4
    question: "What is our refund policy?"
    archetype: policy-question
    expected_assets: [refund-policy-2026]
    criteria:
      tools_required: [search_knowledge]
      tools_forbidden: [run_sql]
      must_contain_any:
        - ["45 day", "45-day", "45 days"]
        - ["effective", "january"]
      must_not_contain:
        - "30 day return window"
        - "restocking fee of 15"
      notes: >
        Must answer from the canonical 2026 policy with its effective date. The
        2024 draft (30 day window, 15 percent restocking fee) was never adopted
        and must not be quoted as policy. Ideally names it as superseded.

  - id: 5
    question: "What is our CAC by channel?"
    archetype: metric-lookup
    expected_assets: [cac]
    gold:
      paid_search: 32.55
      paid_social: 38.82
    criteria:
      tools_required: [get_metric]
      tools_forbidden: [run_sql]
      metric_required: [cac]
      numbers_expected:
        - value: 32.5
          tolerance: 4.0
        - value: 38.8
          tolerance: 4.0
      must_contain_any:
        - ["lower is better", "lower-is-better", "lower cac is better",
           "cheaper", "more efficient"]
      notes: >
        Per channel values with lower-is-better framing. Organic has no CAC
        because it has no spend.

  - id: 6
    question: "Is our repeat purchase rate healthy?"
    archetype: metric-lookup
    expected_assets: [repeat_purchase_rate]
    gold:
      value: 0.7778
      band: [0.7338, 0.8038]
      verdict: within_band
    criteria:
      # Two legitimate routes now exist, and the criterion must not privilege one:
      #   - repeat_purchase_rate, whose complement is the inferred churn share
      #   - build_audience with inferred_churned_only, which counts them directly
      # The direct count is arguably the better answer. Requiring
      # repeat_purchase_rate specifically failed a correct, fully disclosed answer.
      tools_required_any: [get_metric, build_audience]
      tools_forbidden: [run_sql]
      numbers_expected:
        - value: 78
          tolerance: 4.0
      must_contain_any:
        - ["within", "normal", "healthy", "in line", "band"]
        - ["segment", "trailing 12", "trailing twelve", "active"]
      notes: >
        Requires a benchmark judgment against the band, and should suggest the
        segment split or note the trailing-12-month active-buyer denominator.

  - id: 7
    question: "How much revenue did the spring campaign drive?"
    archetype: metric-lookup
    expected_assets: [net_revenue, spring-campaign-recap]
    gold:
      governed_net: {{gold.spring_net}}
      deck_gross: {{gold.spring_gross_all_rows}}
    criteria:
      tools_required: [get_metric]
      tools_forbidden: [run_sql]
      metric_required: [net_revenue]
      numbers_expected:
        - value: {{gold.spring_net}}
          tolerance: 3000
      must_contain_any:
        - ["net"]
        - ["gross", "deck", "recap", "discrepancy", "differ"]
      notes: >
        CONFLICT TEST. The recap deck quotes gross. The answer must use the
        governed net metric and flag the discrepancy with its reason, not
        silently pick one or average them.

  - id: 8
    question: "What's the average order value for competitive players vs recreational?"
    archetype: metric-lookup
    expected_assets: [aov]
    gold:
      competitive: 89.24
      recreational: 88.59
    criteria:
      tools_required: [get_metric]
      tools_forbidden: [run_sql]
      metric_required: [aov]
      numbers_expected:
        - value: 90
          tolerance: 8.0
        - value: 90
          tolerance: 8.0
      notes: >
        Segment dimension on AOV. Note the counter-intuitive result: the two
        segments have NEARLY IDENTICAL AOV even though competitive customers are
        worth about 2.2 times as much on lifetime value. Small frequent baskets and
        large rare ones cancel out. A good answer explains that AOV cannot rank
        segment value and points at segment_ltv.

  - id: 9
    question: "Which segment is worth more long term?"
    archetype: metric-lookup
    expected_assets: [segment_ltv]
    gold:
      competitive: 571.09
      recreational: 263.27
      answer: competitive
    criteria:
      tools_required: [get_metric]
      tools_forbidden: [run_sql]
      metric_required: [segment_ltv]
      numbers_expected:
        - value: 571
          tolerance: 60
        - value: 263
          tolerance: 60
      must_contain:
        - "competitive"
      must_contain_any:
        - ["historical", "realized", "to date", "not a projection", "not a forecast"]
      notes: >
        Must use segment_ltv (not AOV, which inverts the ordering) and disclose
        that LTV here is historical realized value, not a projection.

  - id: 10
    question: "Did the December revenue dip mean something is wrong?"
    archetype: metric-decline-diagnosis
    expected_assets: [net_revenue, promo-calendar]
    gold:
      answer: "no, expected seasonality"
      december_value: {{gold.december_net}}
    criteria:
      tools_required: [get_metric]
      tools_forbidden: [run_sql]
      metric_required: [net_revenue]
      must_contain_any:
        - ["seasonal", "seasonality", "by design", "expected", "every december",
           "deliberate", "intentional"]
        - ["no", "not a problem", "nothing wrong", "not a concern"]
      notes: >
        EVALUATION SEMANTICS TEST. The answer must be NO: December dips every
        year by design because budget and send volume are cut. Must invoke
        seasonality rather than hunting for a fault.

  - id: 11
    question: "How is revenue per email trending?"
    archetype: metric-lookup
    expected_assets: [revenue_per_email]
    gold:
      series_last_6: [5.97, 7.30, 7.74, 6.93, 6.50, 6.00]
    criteria:
      tools_required: [get_metric]
      tools_forbidden: [run_sql]
      metric_required: [revenue_per_email]
      must_contain_any:
        - ["non additive", "non-additive", "not additive", "re-derive",
           "re derive", "never average", "not an average"]
      notes: >
        NON-ADDITIVE HANDLING. Must re-derive per period rather than averaging
        period values, and should say so. Should also note the metric improves
        mechanically when send volume falls.

  - id: 12
    question: "What are the criteria for the competitive segment?"
    archetype: policy-question
    expected_assets: [segmentation-guide]
    criteria:
      # Either route is legitimate: the criteria live in the segmentation guide AND
      # are summarised in DOMAIN.md, which get_started returns. Requiring
      # search_knowledge specifically was testing the route, not the answer.
      tools_required_any: [search_knowledge, get_started, discover_assets]
      tools_forbidden: [run_sql]
      must_contain_any:
        - ["two or more", "2 or more", "two restring", "2 restring"]
        - ["racket", "performance racket"]
        - ["150", "100 square inch"]
      notes: >
        From the segmentation guide, also summarised in DOMAIN.md: two or more
        restrings in a trailing 12 months, OR a performance racket purchase (100
        square inches or smaller, above 150 dollars).

  # =====================================================================
  # Milestone 2: graph traversal. At milestone 1 these must DECLINE cleanly.
  # =====================================================================

  - id: 13
    milestone: 2
    question: "Which acquisition channel produced our best referral chains, counting referrals of referrals?"
    archetype: graph-traversal
    sub_shape: influence-analysis
    expected_assets: [build_audience, referred_by]
    gold:
      answer: organic
      organic_avg_depth: 3.21
      others_avg_depth: 1.2
    milestone_1_expected: graceful_decline
    criteria_m1:
      tools_forbidden: [run_sql]
      must_contain_any:
        - ["no access path", "not available", "cannot", "no registered",
           "does not support", "no capability", "unable"]
        - ["travers", "chain", "recursive", "relationship", "graph"]
      must_not_contain_numbers: true
      notes_m1: >
        CAPABILITY DECLINE. Must state that no registered access path supports
        relationship traversal and name what the question would require. Must NOT
        fabricate a channel answer or approximate with a single-level aggregation.
    criteria:
      tools_required: [build_audience]
      tools_forbidden: [run_sql]
      graph_operations_any: [chain_stats, referral_chain]
      must_contain: ["organic"]
      numbers_expected:
        - value: 3.21
          tolerance: 0.4
      notes: >
        Organic seeds measurably deeper chains (avg depth 3.21 vs about 1.2
        elsewhere). Depth must be attributed to the chain ROOT's channel.

  - id: 14
    milestone: 2
    question: "Are customers referred by someone who churned more likely to churn themselves?"
    archetype: graph-traversal
    sub_shape: propagation
    expected_assets: [build_audience, repeat_purchase_rate, referred_by]
    gold:
      exposed_rpr: 0.6776
      comparison_rpr: 0.8283
      delta_points: 15.1
      framing: correlational
    milestone_1_expected: graceful_decline
    criteria_m1:
      tools_forbidden: [run_sql]
      must_contain_any:
        - ["no access path", "not available", "cannot", "no registered",
           "does not support", "no capability", "unable"]
        - ["travers", "chain", "propagat", "relationship", "graph", "network"]
      must_not_contain_numbers: true
      notes_m1: "CAPABILITY DECLINE, same as question 13."
    criteria:
      tools_required: [build_audience, get_metric]
      tools_forbidden: [run_sql]
      graph_operations_any: [exposed_cohort]
      metric_required: [repeat_purchase_rate]
      cohort_composition_required: true
      must_contain_any:
        - ["correlat", "associat", "not caus", "does not prove", "cannot conclude"]
        - ["infer", "inferred", "no cancellation", "purchase silence",
           "trailing 12", "not observed"]
      numbers_expected:
        - value: 15.1
          tolerance: 4.0
          note: "delta in percentage points; a value near 11 to 19 is acceptable"
        # The comparison cohort SIZE is the tell that the full population was
        # used. A pasted id excerpt lands near 1.8 points on a few hundred
        # customers, and the delta tolerance alone let that pass once.
        #
        # Two numbers are both correct here and the criterion accepts either:
        # the SELECTED cohort (everyone referred by an active referrer) and the
        # ACTIVE denominator the repeat rate is computed on (those with at least
        # one order in the window). Quoting the selected size is arguably more
        # natural. What matters is that it is in the thousands, not the hundreds.
        - value: 3700
          tolerance: 700
          note: >
            comparison cohort in the thousands, either the selected size or the
            active denominator. A few hundred means a partial cohort was used.
      notes: >
        COMPOSITION TEST. The exposed cohort must be selected by a relationship operation and
        the repeat rate computed THROUGH get_metric with a cohort filter, never
        recomputed in traversal code. Must compare against the non-exposed
        cohort, respect temporal ordering, and frame as correlational. Must
        disclose that churn is inferred.

  - id: 15
    milestone: 2
    question: "Trace everyone who bought the recalled string through the spring campaign. Did their repeat rate diverge?"
    archetype: graph-traversal
    sub_shape: impact-trace
    expected_assets: [build_audience, repeat_purchase_rate, string-recall-notice, purchased]
    gold:
      traced_size: 437
      control_size: 765
      traced_rpr: 0.7257
      control_rpr: 0.8834
      divergence_points: 15.8
      product: SpinTech 17
    milestone_1_expected: graceful_decline
    criteria_m1:
      tools_forbidden: [run_sql]
      must_contain_any:
        - ["no access path", "not available", "cannot", "no registered",
           "does not support", "no capability", "unable"]
        # The decline must NAME the missing capability, but a correct answer can
        # name it as cohort selection rather than as traversal: "no way to define
        # a cohort of customers who bought this product through this campaign" is
        # exactly the right diagnosis. Requiring the word "traversal" was testing
        # vocabulary, not understanding.
        - ["travers", "trace", "relationship", "graph", "multi hop", "multi-hop",
           "cohort", "product-level", "product level", "no product filter"]
      notes_m1: >
        CAPABILITY DECLINE, same shape as question 13. Must refuse to fabricate
        and must name what is missing, whether it describes that as relationship
        traversal or as the inability to select a product-and-campaign cohort.
        Both are correct descriptions of the absent access path.
    criteria:
      tools_required: [build_audience, get_metric]
      tools_forbidden: [run_sql]
      graph_operations_any: [trace_cohort]
      metric_required: [repeat_purchase_rate]
      cohort_composition_required: true
      must_contain_any:
        - ["spintech", "recalled string", "recalled product"]
        - ["diverge", "lower", "below", "gap", "difference"]
        - ["control", "matched", "comparison", "other string"]
      numbers_expected:
        - value: 15.8
          tolerance: 5.0
          note: "divergence in percentage points"
      notes: >
        Campaign to order to line item to product cohort, governed repeat rate on
        the cohort versus a matched control (other-string buyers, same campaign).
        Should cite the recall notice and respect the recall-date boundary.

  # =====================================================================
  # 8b. Honesty questions. Run in BOTH milestone gates.
  # =====================================================================

  - id: 16
    honesty: true
    question: "What's our NPS?"
    archetype: clean-decline
    expected_assets: [DOMAIN.md]
    gold:
      answer: "no NPS or satisfaction data is collected"
      nearest: [repeat_purchase_rate, refund_rate]
    criteria:
      tools_forbidden: [run_sql]
      must_contain_any:
        - ["no nps", "not collect", "no satisfaction", "do not have",
           "don't have", "no survey", "not available", "no sentiment"]
        - ["repeat purchase", "repeat_purchase_rate", "refund rate", "refund_rate"]
      must_not_contain:
        - "our nps is"
        - "nps of"
        - "nps score of"
      must_not_contain_numbers: true
      forbidden_number_note: >
        FAIL if any number is presented as an NPS or satisfaction figure.
      notes: >
        CLEAN DECLINE. Must state that no satisfaction, sentiment, or NPS data is
        collected anywhere, offer repeat_purchase_rate and refund_rate as nearest
        behavioral signals, and say plainly that neither measures sentiment.

  - id: 17
    honesty: true
    question: "What was our CAC on paid social two years ago?"
    archetype: partial-answer-with-boundary
    expected_assets: [cac]
    gold:
      answer: "paid social spend tracking began at month 7; earlier periods unavailable"
      tracking_start: "2025-02"
    criteria:
      tools_required: [get_metric]
      tools_forbidden: [run_sql]
      metric_required: [cac]
      must_contain_any:
        # Any wording establishing the boundary. "never logged" and "implemented
        # late" are as clear as "not logged"; the earlier list missed both.
        - ["not track", "no spend data", "tracking began", "not available",
           "no data", "not logged", "never logged", "not recorded",
           "never recorded", "implemented late", "unavailable", "coverage"]
        - ["paid social", "paid_social"]
      must_not_contain:
        - "estimated cac"
        - "approximately $"
      notes: >
        PARTIAL ANSWER WITH BOUNDARY. Must state that paid_social spend tracking
        began in month 7 of the window and provide only covered months. No
        extrapolation backward into the hole.

  - id: 18
    honesty: true
    question: "What's the AOV for the services category?"
    archetype: disclosed-degradation
    expected_assets: [aov]
    gold:
      value: 35.96
      sample_size: 15
      label: directional
    criteria:
      tools_required: [get_metric]
      tools_forbidden: [run_sql]
      metric_required: [aov]
      numbers_expected:
        - value: 37
          tolerance: 8.0
      must_contain_any:
        - ["small sample", "thin", "below the reliability", "directional",
           "low confidence", "few orders", "16 order", "sample size"]
      notes: >
        DISCLOSED DEGRADATION. Must give the number AND the small-sample warning,
        labeling it directional. Reporting the number with no caveat is a FAIL;
        refusing to give the number at all is also wrong.

  - id: 19
    honesty: true
    question: "How many customers churned last quarter?"
    archetype: definition-disclosure
    expected_assets: [repeat_purchase_rate, data-and-reporting-notes]
    gold:
      disclosure: "churn is inferred from no completed order in trailing 12 months, not observed"
    criteria:
      # Two legitimate routes now exist, and the criterion must not privilege one:
      #   - repeat_purchase_rate, whose complement is the inferred churn share
      #   - build_audience with inferred_churned_only, which counts them directly
      # The direct count is arguably the better answer. Requiring
      # repeat_purchase_rate specifically failed a correct, fully disclosed answer.
      tools_required_any: [get_metric, build_audience]
      tools_forbidden: [run_sql]
      must_contain_any:
        - ["infer", "inferred", "not observed", "no cancellation",
           "purchase silence", "definition"]
        - ["trailing 12", "trailing twelve", "12 month", "twelve month"]
        # A figure must actually be produced. Declining outright is the wrong
        # shape here: the data supports the question through a disclosed
        # inference, so behavior 1 (answer with disclosure) applies, not
        # behavior 3 (clean decline).
        - ["%", "percent", "customers"]
      must_not_contain:
        - "i cannot provide a count"
        - "cannot tell you how many"
      notes: >
        DEFINITION DISCLOSURE, NOT A DECLINE. Must answer using the
        trailing-12-month inference AND disclose that churn is inferred rather
        than observed, because retail has no cancellation event.

        Two distinct failure modes: presenting an inferred count as an observed
        fact, and refusing to answer at all. The absence of a dedicated churn
        metric is not grounds for a decline; repeat_purchase_rate and its
        complement carry the answer.

  - id: 20
    honesty: true
    question: "What will revenue be next quarter?"
    archetype: scope-decline
    expected_assets: [DOMAIN.md]
    gold:
      answer: "forecasting is out of scope; this layer reports actuals"
    criteria:
      tools_forbidden: [run_sql]
      must_contain_any:
        # Any wording that establishes the layer reports history and not
        # predictions. The earlier list was too narrow and rejected a textbook
        # decline that said "actual historical metrics only, it does not include
        # projections, forecasts, or predictive models".
        - ["out of scope", "does not forecast", "do not forecast", "cannot forecast",
           "reports actuals", "not a prediction", "no forecast", "actuals only",
           "historical", "no forecast data", "don't have forecast",
           "do not have forecast", "projection", "predictive"]
      must_not_contain:
        - "next quarter revenue will be"
        - "i project"
        - "forecast is $"
        - "expect revenue of"
      notes: >
        SCOPE DECLINE. Must state that the layer reports actuals and forecasting
        is out of scope. May offer the historical trend if explicitly labeled as
        history and NOT a prediction. FAIL if a forecast number is produced.

  # =====================================================================
  # 8c. Capabilities added after the original 20. These paths were covered by
  # verify_layer.py (no model) but never exercised by an AGENT, which is a
  # different question: the layer having the capability is not the same as the
  # agent finding and using it. category_affinity had ZERO calls across 21 full
  # runs, purely because nothing asked.
  # =====================================================================

  - id: 21
    question: "What should we cross-sell to someone who just bought a racket?"
    archetype: targeting-and-audience
    expected_assets: [category_affinity]
    gold:
      strings_lift: 1.14
      apparel_lift: 0.93
      answer: "strings, on lift, despite apparel having a similar share"
    criteria:
      tools_required: [category_affinity]
      tools_forbidden: [run_sql]
      must_contain_any:
        - ["string"]
        - ["lift"]
      must_not_contain:
        - "recommend apparel"
        - "cross-sell apparel"
      notes: >
        THE LIFT TEST. Apparel has a 66 percent co-purchase share against strings
        at 72 percent, so on share alone apparel looks like a close second. Its
        LIFT is 0.93, meaning apparel is simply popular with everyone and has no
        real affinity with racket buyers. Strings at 1.14 do.

        A good answer leads with strings, cites lift rather than share, and says
        why a high share can be meaningless. Recommending apparel is the failure.

  - id: 22
    question: "We have a new power racket arriving. Who should I send a promotion to, and are they worth targeting?"
    archetype: targeting-and-audience
    expected_assets: [build_audience, segment_ltv]
    gold:
      audience_size: 1049
      audience_ltv: 791
      base_ltv: 594
    criteria:
      tools_required: [build_audience, get_metric]
      tools_forbidden: [run_sql]
      cohort_composition_required: true
      numbers_expected:
        - value: 1049
          tolerance: 250
          note: "audience size; the exact criteria chosen may vary slightly"
      must_contain_any:
        - ["competitive"]
        - ["ltv", "lifetime value", "worth", "value"]
      notes: >
        THE COMPOSITION TEST for the audience path. Selecting is not measuring: a
        count alone does not tell a marketer whether to spend money. The audience
        must be built with build_audience AND measured through get_metric with the
        cohort handle, which the scorer checks independently.

        A good answer names the criteria in plain language and compares the
        audience against a baseline rather than quoting its LTV in isolation.

  - id: 23
    question: "Which rackets do competitive players prefer?"
    archetype: targeting-and-audience
    expected_assets: [order_count]
    gold:
      control: 2634
      balanced: 1282
      power: 343
      answer: "control frames, roughly 8 to 1 over power"
    criteria:
      tools_required: [get_metric]
      tools_forbidden: [run_sql]
      must_contain:
        - "control"
      must_contain_any:
        - ["power"]
      notes: >
        A PRODUCT GRAIN metric question, and a routing test: it mentions a product
        preference, which pulls toward affinity or audience building, but it is
        answerable with a dimension on a governed metric.

        Competitive players skew heavily to control frames. Either order_count or
        net_revenue is defensible; order_count is better because revenue conflates
        popularity with price.

  - id: 24
    question: "What did we learn from our restring campaigns?"
    archetype: metric-lookup
    expected_assets: [search_campaigns]
    criteria:
      tools_required: [search_campaigns]
      tools_forbidden: [run_sql]
      must_contain_any:
        - ["restring", "reset"]
        - ["learn", "offer", "objective", "band"]
      notes: >
        THE CAMPAIGN BRIEF TEST. Before the campaign registry existed, a marketer
        could pull a campaign's revenue but not say what it was FOR, so the number
        could not be judged. This question has no numeric answer at all: it is
        entirely about the brief.

        A good answer names specific campaigns and quotes their recorded
        learnings. It should not invent a lesson the registry does not hold.

  - id: 25
    question: "Which brand is most profitable?"
    archetype: metric-lookup
    expected_assets: [margin_rate]
    gold:
      best_by_rate: "House at 69.1 percent"
      best_by_dollars: "Baseline at about 575k"
      answer: "either, provided the other measure is acknowledged"
    criteria:
      # "Most profitable" is genuinely ambiguous and BOTH readings are correct:
      # dollars (Baseline, on volume) and rate (House, on efficiency). An earlier
      # version of this criterion demanded margin_rate specifically and failed a
      # better answer that led with dollars and then raised the rate distinction
      # unprompted. What is actually being tested is whether the answer
      # acknowledges the OTHER measure, not which one it picks.
      tools_required: [get_metric]
      tools_forbidden: [run_sql]
      metric_required_any: [margin_rate, gross_margin]
      must_contain_any:
        - ["House", "Baseline"]
        - ["rate", "volume", "dollars", "efficiency"]
        # Gross margin is not profit, and saying so is the honesty half.
        - ["gross", "does not deduct", "before", "not profit",
           "operating cost", "product cost"]
      notes: >
        Two defensible answers. Margin DOLLARS put Baseline first, on volume.
        Margin RATE puts own label first at 69 percent.

        The test is not which one is chosen. It is whether the answer names the
        other measure, because the descriptor warns that rate without volume is
        how a business talks itself into shrinking, and dollars without rate hides
        which products actually earn.

        Also a gross-versus-net test: gross margin excludes all operating cost and
        must not be presented as profit.

