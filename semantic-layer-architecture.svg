      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b45309"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="60" y="52" font-size="26" font-weight="700" fill="#0f172a">Semantic Layer POC · Baseline Tennis Co.</text>
  <text x="60" y="76" font-size="14" fill="#64748b">MCP-first architecture · Milestone 1 (solid) · Milestone 2 additions (amber, dashed)</text>

  <!-- ===================== AGENT LAYER ===================== -->
  <rect x="60" y="100" width="880" height="96" rx="10" fill="#eef2ff" stroke="#6366f1" stroke-width="1.5"/>
  <text x="80" y="126" font-size="13" font-weight="700" fill="#4338ca" letter-spacing="1">AGENTS (the model is the agent)</text>
  <rect x="80" y="138" width="250" height="44" rx="7" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="205" y="158" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Claude Desktop</text>
  <text x="205" y="174" font-size="11" fill="#64748b" text-anchor="middle">demo path · no API key</text>
  <rect x="350" y="138" width="250" height="44" rx="7" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="475" y="158" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Claude Code</text>
  <text x="475" y="174" font-size="11" fill="#64748b" text-anchor="middle">claude mcp add baseline-tennis</text>
  <rect x="620" y="138" width="300" height="44" rx="7" fill="#ffffff" stroke="#a5b4fc"/>
  <text x="770" y="158" font-size="14" font-weight="600" fill="#1e293b" text-anchor="middle">Eval harness · agent.py</text>
  <text x="770" y="174" font-size="11" fill="#64748b" text-anchor="middle">Anthropic API · 20-question gates</text>

  <!-- Baseline server (right side) -->
  <rect x="1000" y="100" width="380" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="1020" y="126" font-size="13" font-weight="700" fill="#475569" letter-spacing="1">BASELINE SERVER (--baseline)</text>
  <text x="1020" y="148" font-size="12" fill="#475569">the "before" in every demo</text>
  <rect x="1020" y="162" width="160" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1100" y="183" font-size="12" fill="#334155" text-anchor="middle">run_sql</text>
  <rect x="1196" y="162" width="164" height="34" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1278" y="183" font-size="12" fill="#334155" text-anchor="middle">naive_search</text>
  <text x="1020" y="226" font-size="11" fill="#94a3b8">falls into every planted trap: test rows,</text>
  <text x="1020" y="241" font-size="11" fill="#94a3b8">machine opens, gross vs net, fabricated NPS</text>

  <!-- MCP arrows -->
  <line x1="340" y1="196" x2="340" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="352" y="232" font-size="12" fill="#475569">MCP · stdio</text>
  <line x1="770" y1="196" x2="770" y2="256" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="782" y="232" font-size="12" fill="#475569">tools.py direct</text>

  <!-- ===================== MCP SERVER ===================== -->
  <rect x="60" y="260" width="880" height="204" rx="10" fill="#ecfeff" stroke="#0891b2" stroke-width="1.5"/>
  <text x="80" y="288" font-size="13" font-weight="700" fill="#0e7490" letter-spacing="1">SEMANTIC MCP SERVER · mcp_server.py (FastMCP)</text>
  <text x="80" y="308" font-size="12" fill="#155e75">Server instructions: classify archetype → get_playbook → follow it · never estimate · governed metric beats documents · surface confidence flags · honest declines</text>

  <!-- tool chips -->
  <g font-size="12" fill="#0f172a">
    <rect x="80" y="326" width="128" height="34" rx="6" fill="#ffffff" stroke="#67e8f9"/><text x="144" y="347" text-anchor="middle">get_started</text>
    <rect x="216" y="326" width="150" height="34" rx="6" fill="#ffffff" stroke="#67e8f9"/><text x="291" y="347" text-anchor="middle">discover_assets</text>
    <rect x="374" y="326" width="128" height="34" rx="6" fill="#ffffff" stroke="#67e8f9"/><text x="438" y="347" text-anchor="middle">get_metric</text>
    <rect x="510" y="326" width="160" height="34" rx="6" fill="#ffffff" stroke="#67e8f9"/><text x="590" y="347" text-anchor="middle">search_knowledge</text>
    <rect x="678" y="326" width="130" height="34" rx="6" fill="#ffffff" stroke="#67e8f9"/><text x="743" y="347" text-anchor="middle">get_playbook</text>
    <rect x="80" y="368" width="128" height="34" rx="6" fill="#ffffff" stroke="#67e8f9"/><text x="144" y="389" text-anchor="middle">list_metrics</text>
    <rect x="216" y="368" width="150" height="34" rx="6" fill="#fffbeb" stroke="#f59e0b" stroke-dasharray="5 3"/><text x="291" y="389" text-anchor="middle" fill="#92400e">query_graph · M2</text>
  </g>

  <!-- interpretation strip -->
  <rect x="386" y="368" width="534" height="76" rx="7" fill="#fefce8" stroke="#ca8a04"/>
  <text x="404" y="390" font-size="12" font-weight="700" fill="#854d0e">interpretation.py · meaning travels with data</text>
  <text x="404" y="408" font-size="11" fill="#713f12">benchmark judgment · direction-of-goodness · seasonality · required caveats</text>
  <text x="404" y="424" font-size="11" fill="#713f12">confidence block: sample size vs min_sample · coverage holes · inferred definitions</text>
  <text x="404" y="440" font-size="11" font-weight="600" fill="#854d0e">honest declines: degrade → partial → decline + alternative → capability</text>

  <!-- ===================== CONTENT (right column) ===================== -->
  <rect x="1000" y="280" width="380" height="420" rx="10" fill="#f0fdf4" stroke="#16a34a" stroke-width="1.5"/>
  <text x="1020" y="308" font-size="13" font-weight="700" fill="#15803d" letter-spacing="1">SEMANTIC CONTENT · Git YAML/MD</text>
  <text x="1020" y="326" font-size="12" fill="#166534">where the intelligence accrues · AI writes config, never code</text>
  <g font-size="12" fill="#14532d">
    <rect x="1020" y="342" width="340" height="40" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="1034" y="359" font-weight="600">DOMAIN.md</text><text x="1034" y="375" font-size="11" fill="#4d7c0f">orientation + negative scope ("cannot answer")</text>
    <rect x="1020" y="390" width="340" height="40" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="1034" y="407" font-weight="600">/metrics · 10 definitions</text><text x="1034" y="423" font-size="11" fill="#4d7c0f">computation · evaluation · framing · reliability</text>
    <rect x="1020" y="438" width="340" height="40" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="1034" y="455" font-weight="600">/catalog · asset + edge descriptors</text><text x="1034" y="471" font-size="11" fill="#4d7c0f">authority · effective_date · supersedes · when_to_use</text>
    <rect x="1020" y="486" width="340" height="40" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="1034" y="503" font-weight="600">/playbooks · 3 + 1</text><text x="1034" y="519" font-size="11" fill="#4d7c0f">lookup · diagnosis · policy · graph-traversal (M2)</text>
    <rect x="1020" y="534" width="340" height="40" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="1034" y="551" font-weight="600">/ontology · concepts.yaml</text><text x="1034" y="567" font-size="11" fill="#4d7c0f">concept→asset · combination + negative routing rules</text>
    <rect x="1020" y="582" width="340" height="40" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="1034" y="599" font-weight="600">/benchmarks</text><text x="1034" y="615" font-size="11" fill="#4d7c0f">written by seed.py from generated data</text>
    <rect x="1020" y="630" width="340" height="40" rx="6" fill="#ffffff" stroke="#86efac"/>
    <text x="1034" y="647" font-weight="600">/spine</text><text x="1034" y="663" font-size="11" fill="#4d7c0f">churn-is-inferred · last-touch attribution · calendar</text>
  </g>
  <!-- content feeds server -->
  <line x1="1000" y1="400" x2="944" y2="362" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="905" y="392" font-size="11" fill="#15803d" text-anchor="end">loaded by catalog.py</text>

  <!-- ===================== ACCESS PATHS ===================== -->
  <line x1="360" y1="464" x2="240" y2="524" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="500" y1="464" x2="500" y2="524" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="640" y1="464" x2="770" y2="524" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowAmber)"/>

  <text x="60" y="512" font-size="13" font-weight="700" fill="#334155" letter-spacing="1">GOVERNED ACCESS PATHS</text>

  <rect x="60" y="524" width="300" height="120" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="80" y="550" font-size="14" font-weight="700" fill="#0f172a">metrics_engine.py</text>
  <text x="80" y="570" font-size="11" fill="#475569">compiles metric + dims + period + cohort</text>
  <text x="80" y="586" font-size="11" fill="#475569">into parameterized SQL from YAML</text>
  <text x="80" y="602" font-size="11" fill="#475569">rejects disallowed dims/grains with</text>
  <text x="80" y="618" font-size="11" fill="#475569">readable errors · no raw SQL from agent</text>

  <rect x="380" y="524" width="280" height="120" rx="10" fill="#ffffff" stroke="#334155" stroke-width="1.5"/>
  <text x="400" y="550" font-size="14" font-weight="700" fill="#0f172a">retrieval.py</text>
  <text x="400" y="570" font-size="11" fill="#475569">chunks + MiniLM embeddings</text>
  <text x="400" y="586" font-size="11" fill="#475569">wrapper metadata on every chunk:</text>
  <text x="400" y="602" font-size="11" fill="#475569">authority · effective_date · supersedes</text>
  <text x="400" y="618" font-size="11" fill="#475569">also embeds catalog entries for discovery</text>

  <rect x="680" y="524" width="260" height="120" rx="10" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="700" y="550" font-size="14" font-weight="700" fill="#92400e">graph.py · Milestone 2</text>
  <text x="700" y="570" font-size="11" fill="#78350f">networkx in-memory, built from SQLite</text>
  <text x="700" y="586" font-size="11" fill="#78350f">closed ops: referral_chain · exposed_cohort</text>
  <text x="700" y="602" font-size="11" fill="#78350f">trace_cohort · chain_stats</text>
  <text x="700" y="618" font-size="11" font-weight="600" fill="#92400e">cohorts flow BACK through get_metric</text>

  <!-- graph cohort composition arrow -->
  <path d="M 680 604 C 560 680 380 668 340 646" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowAmber)"/>
  <text x="500" y="690" font-size="11" fill="#92400e" text-anchor="middle">graph selects cohort → metric evaluates cohort (only path from graph to numbers)</text>

  <!-- ===================== DATA ESTATE ===================== -->
  <line x1="210" y1="644" x2="210" y2="744" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="644" x2="520" y2="744" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="810" y1="644" x2="810" y2="744" stroke="#b45309" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrowAmber)"/>
  <text x="822" y="700" font-size="11" fill="#92400e">reads edges at startup</text>

  <text x="60" y="732" font-size="13" font-weight="700" fill="#334155" letter-spacing="1">LOCAL DATA ESTATE · deterministic seed 42</text>

  <rect x="60" y="744" width="360" height="150" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="80" y="770" font-size="14" font-weight="700" fill="#0f172a">SQLite · tennis_store.db</text>
  <text x="80" y="790" font-size="11" fill="#475569">customers (referred_by) · orders · products (recalled)</text>
  <text x="80" y="806" font-size="11" fill="#475569">order_items · email_sends · campaigns · ad_spend</text>
  <text x="80" y="828" font-size="11" font-weight="600" fill="#0f172a">planted traps: test/wholesale rows · machine opens</text>
  <text x="80" y="844" font-size="11" font-weight="600" fill="#0f172a">signup drop · churn cluster · recall divergence</text>
  <text x="80" y="864" font-size="11" font-weight="600" fill="#b91c1c">planted gaps: no NPS · spend hole · thin services slice</text>
  <text x="80" y="880" font-size="11" fill="#475569">seed.py asserts every signal, floor, and gap</text>

  <rect x="440" y="744" width="300" height="150" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="1.5"/>
  <text x="460" y="770" font-size="14" font-weight="700" fill="#0f172a">ChromaDB (embedded)</text>
  <text x="460" y="790" font-size="11" fill="#475569">document chunks + catalog embeddings</text>
  <text x="460" y="812" font-size="14" font-weight="700" fill="#0f172a">/data/documents · 13-15 md</text>
  <text x="460" y="832" font-size="11" fill="#475569">canonical policies · media plan · recall notice</text>
  <text x="460" y="848" font-size="11" font-weight="600" fill="#0f172a">planted: superseded 2024 draft</text>
  <text x="460" y="864" font-size="11" font-weight="600" fill="#0f172a">gross-revenue recap deck (conflict test)</text>

  <rect x="760" y="744" width="180" height="150" rx="10" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="780" y="770" font-size="13" font-weight="700" fill="#475569">Baseline path</text>
  <text x="780" y="790" font-size="11" fill="#64748b">raw SQL + naive</text>
  <text x="780" y="806" font-size="11" fill="#64748b">vector search hit</text>
  <text x="780" y="822" font-size="11" fill="#64748b">the same stores</text>
  <text x="780" y="838" font-size="11" fill="#64748b">with zero</text>
  <text x="780" y="854" font-size="11" fill="#64748b">semantics</text>

  <!-- baseline server down-arrow to data -->
  <path d="M 1190 250 C 1190 500 940 700 900 744" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow)"/>

  <!-- ===================== EVAL STRIP ===================== -->
  <rect x="60" y="930" width="1320" height="100" rx="10" fill="#fdf2f8" stroke="#db2777" stroke-width="1.5"/>
  <text x="80" y="958" font-size="13" font-weight="700" fill="#9d174d" letter-spacing="1">EVAL · 20 QUESTIONS · trace-scored (right answer via wrong path = FAIL)</text>
  <text x="80" y="982" font-size="12" fill="#831843">Q1-12 mechanisms: governed metrics · authority ranking · conflicts · seasonality &#160;&#160;|&#160;&#160; Q13-15 traversal: M1 = graceful decline, M2 = graph + cohort composition</text>
  <text x="80" y="1002" font-size="12" fill="#831843">Q16-20 honesty: no-NPS decline · coverage boundary · small-sample disclosure · inferred-churn disclosure · forecast refusal</text>
  <text x="80" y="1022" font-size="12" font-weight="600" fill="#9d174d">Gates: milestone 1 = 12 pass + 3 declines + 5 honest &#160;·&#160; milestone 2 = 20/20, no regressions, diff touches content only</text>
</svg>
